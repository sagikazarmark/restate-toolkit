[workspace]
members = ["crates/*", "examples/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/restate-toolkit"

[workspace.dependencies]
restate-config = { path = "crates/restate-config", version = "0.2.0", default-features = false }
restate-e2e-harness = { path = "crates/restate-e2e-harness", version = "0.2.0" }
restate-ext = { path = "crates/restate-ext", version = "0.2.0" }

serde = { version = "1.0.229", default-features = false }
serde_json = { version = "1.0.151", default-features = false }
restate-sdk = { version = "0.12.0", default-features = false }
tokio = { version = "1.53.1", default-features = false }
tracing = "0.1.41"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.metadata.release]
sign-commit = true
sign-tag = true
shared-version = true
tag-message = "Release {{version}}"
tag-name = "v{{version}}"
