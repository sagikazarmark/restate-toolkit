[graph]
all-features = true

[advisories]
# Keep these exceptions in sync with .cargo/audit.toml (see rationale there).
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa via jsonwebtoken; SDK verifies EdDSA with public keys only, no patched release" },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via jsonwebtoken 10 -> p256/p384; SDK verifies EdDSA with public keys only, blocked on restate-sdk-shared-core" },
]

[licenses]
allow = [
  "Apache-2.0",
  "MIT",

  "Unicode-3.0",
  "BSD-3-Clause",
  "ISC",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
