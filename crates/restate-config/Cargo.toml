[package]
name = "restate-config"
version = { workspace = true }
description = "Configuration types and SDK option adapters for Restate endpoints"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
keywords = ["restate", "config", "serde", "durable-execution", "workflow"]
categories = ["config", "asynchronous", "web-programming::http-server"]

[dependencies]
humantime-serde = "1.1.1"
restate-sdk = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = "2.0.16"

[dev-dependencies]
bytes = "1.10"
http = "1.3"
http-body-util = "0.1"
# Identity verification tests need a crypto provider; library users choose their own.
restate-sdk = { workspace = true, features = ["rust_crypto"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
